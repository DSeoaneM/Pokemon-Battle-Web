<!DOCTYPE html>
<html lang="es">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Battle Web</title>
</head>
<body style="margin: 0; padding: 0; min-height: 100vh; background-color:blanchedalmond; display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: center; background-color: darkblue;">
        <p style="color: aliceblue; font-size: large;">¡¡¡Bienvenid@ a la batalla web de Pokémon entrenador!!!</p>
    </div>
    <div style="background-color:whitesmoke; flex: 10;">
        {% for pokemon in DATOS_POKEMON %}
            <p>{{ pokemon["name"] }}</p>
            <img src= '{{ pokemon["sprites"]["front_default"] }}'/>
            {% for tipo in pokemon["types"] %}
                <p>{{ tipo }}</p>
            {% endfor %}
            <button class="btn btn-info">Info</button>
        {% endfor %}
        



    </div>
    <footer style="background-color: lightgray; color: darkolivegreen; font-size: small; display: flex; justify-content: space-between; flex: 1;">
        <p>Proyecto: {{ proyecto }}</p>
        <p>Autor: {{ autor }}</p>
        <p>Año: {{ año }}</p>
    </footer>
</body>
</html>
