{% extends "base.html" %}

{% block links %}
    <link rel="stylesheet" href="{{ url_for('static', filename='window.css') }}">
{% endblock %}

{% block main %}
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <linearGradient id="bolaTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa561"/><stop offset=".55" stop-color="#ec7024"/><stop offset="1" stop-color="#bf5217"/></linearGradient>
        <linearGradient id="bolaBot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f58a3e"/><stop offset=".5" stop-color="#ec7024"/><stop offset="1" stop-color="#c4561a"/></linearGradient>
        <clipPath id="bolaClip"><circle cx="32" cy="32" r="28"/></clipPath>
        <symbol id="pokeball-naranja" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="31" fill="#050805"/>
        <g clip-path="url(#bolaClip)">
            <rect x="0" y="0" width="64" height="32" fill="url(#bolaTop)"/>
            <rect x="0" y="32" width="64" height="32" fill="url(#bolaBot)"/>
            <ellipse cx="22" cy="16" rx="11" ry="6" fill="#fff" opacity=".32" transform="rotate(-25 22 16)"/>
            <rect x="0" y="28" width="64" height="8" fill="#050805"/>
        </g>
        <circle cx="32" cy="32" r="10.5" fill="#050805"/>
        <circle cx="32" cy="32" r="7" fill="#ec7024"/>
        <circle cx="32" cy="32" r="3.4" fill="#ffb27a"/>
        </symbol>
    </defs>
    </svg>

  <div class="window">
    <svg class="ball-center" aria-hidden="true"><use href="#pokeball-naranja"/></svg>

    <div class="box">
      <div class="screen">
        <video id="intro" muted playsinline preload="auto" poster="img/poster.jpg"
               aria-label="Silhouettes for Hypno, Trevenant, Mr. Mime, Banette, Sliggoo, Cofagrigus, Haunter and Cacturne under title Pokémon Battle Web">
          <source src="video/animacion.mp4" type="video/mp4">
        </video>
      </div>
      <div class="frame"></div>
      <svg class="ball tl" aria-hidden="true"><use href="#pokeball-naranja"/></svg>
      <svg class="ball tr" aria-hidden="true"><use href="#pokeball-naranja"/></svg>
      <svg class="ball br" aria-hidden="true"><use href="#pokeball-naranja"/></svg>
      <svg class="ball bl" aria-hidden="true"><use href="#pokeball-naranja"/></svg>
    </div>
  </div>

  <!-- Enlace pendiente: sustituir href="#" por la página de la lista -->
  <a class="button pokemon-list" href="#">Lista de Pokémon</a>

  <script src="js/ventana.js"></script>
{% endblock %}
