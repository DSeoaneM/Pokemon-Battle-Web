{% extends "base.html" %}

{% block header %}

  Complete your register to fight in Pokémon Battles, Trainer

{% endblock %}

{% block main %}
  
  {% if error %}
    <p>{{ error }}</p>
  {% endif %}

  <form method="POST" action="{{ url_for('login')}}">
    <label for="trainer-name">Trainer: </label>
    <input id="trainer-name" name="trainer_name" type="text" placeholder="Ash" autofocus>
    <button type="submit">Continue</button>
  </form>

{% endblock %}
