{% extends "base.html" %}

{% block links %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
{% endblock %}

{% block header %}

  Complete your register to fight in Pokémon Battles, Trainer

{% endblock %}

{% block main %}
  
  {% if error %}
    <p class="form-error">{{ error }}</p>
  {% endif %}

  <form class="login-form" method="POST" action="{{ url_for('login')}}">
    <label for="trainer-name">Trainer: </label>
    <input id="trainer-name" name="trainer_name" type="text" placeholder="Ash" autofocus>
    <button type="submit">Continue</button>
  </form>

{% endblock %}
